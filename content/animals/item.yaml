      - {image: k1.png, region: [278, 26, 1098, 715], ms: 300}
      - {image: base.png}
  - id: rabbit
    name: 小白兔
    intro: 小白兔，吃萝卜。咔嚓咔嚓！
    art:
      base.png:
        ref: vehicles/bus/base.png
        prompt: 一只长耳朵的小白兔，坐着，身体朝右，两只前爪捧着一根带叶子的胡萝卜送到嘴边
      k1.png: 胡萝卜的尖端被咬掉一小口，缺口处呈锯齿形，嘴边有两三个小碎屑；兔子其余部分不变
      k2.png: 胡萝卜被咬掉一大半，只剩带叶子的一小段，嘴边有两三个小碎屑，兔子的脸颊鼓起；兔子其余部分不变
