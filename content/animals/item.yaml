# 翻到某只动物时念整句，同时自动播一遍动画。
# region 是源图像素 [x, y, w, h]，只在这个范围内采用关键帧，其余部分保持 base.png。
type: figures
title: 小动物
figures:
  - id: cat
    name: 小猫
    intro: 小花猫，喵喵叫。喵——！
    art:
      base.png:
        ref: vehicles/bus/base.png
        prompt: 一只圆脸大眼睛的小猫，四脚站立，身体朝右，长尾巴在身后向上翘起，嘴巴闭着
      k1.png: 小猫张开小嘴在叫，嘴边向外画 2 到 3 条短弧线表示叫声；尾巴不变
      k2.png: 小猫的尾巴向另一侧弯过去，尾巴尖卷成一个小钩；嘴巴闭着，头和身体不变
    frames:
      - {image: k1.png, region: [1177, 426, 202, 154], ms: 600}
      - {image: k2.png, region: [84, 41, 590, 563], ms: 500}
      - {image: base.png}
  - id: dog
    name: 小狗
    intro: 小狗摇尾巴。汪汪！
    art:
      base.png:
        ref: vehicles/bus/base.png
        prompt: 一只圆脸垂耳朵的小狗，四脚站立，身体朝右，短尾巴在身后向上翘起，嘴巴闭着
      k1.png: 小狗的尾巴向左歪，尾巴旁边画 2 条表示摇动的短弧线；头和身体不变
      k2.png: 小狗的尾巴向右歪，尾巴旁边画 2 条表示摇动的短弧线，同时小狗张嘴叫，嘴边画 2 到 3 条短弧线表示叫声
    frames:
      - {image: k1.png, region: [74, 309, 266, 233], ms: 300}
      - {image: k2.png, region: [194, 249, 1219, 324], ms: 300}
      - {image: k1.png, region: [74, 309, 266, 233], ms: 300}
      - {image: k2.png, region: [194, 249, 1219, 324], ms: 300}
      - {image: base.png}
  - id: rooster
    name: 大公鸡
    intro: 大公鸡，早早起。喔喔喔！
    art:
      base.png:
        ref: vehicles/bus/base.png
        prompt: 一只大公鸡，站立，身体朝右，头上有大鸡冠，尾巴羽毛高高翘起，嘴巴闭着
      k1.png: 公鸡抬头张开尖嘴打鸣，嘴巴前方向外放射 3 条短弧线表示叫声；身体和尾巴不变
    frames:
      - {image: k1.png, region: [731, 0, 626, 617], ms: 1000}
      - {image: base.png}
  - id: duck
    name: 小鸭子
    intro: 小鸭子，游呀游。嘎嘎！
    art:
      base.png:
        ref: vehicles/bus/base.png
        prompt: 一只圆滚滚的小黄鸭，浮在水面上，身体朝右，翅膀收在身体两侧，身体下方画两三条波浪线表示水面
      k1.png: 小鸭子张开两只翅膀向上扬起，嘴巴张开，嘴边画 2 条短弧线表示嘎嘎叫；水面波浪线不变
      k2.png: 小鸭子翅膀收回身体两侧，水面上多画几圈向外扩散的波纹
    frames:
      - {image: k1.png, region: [268, 92, 1114, 777], ms: 500}
      - {image: base.png, ms: 200}
      - {image: k2.png, region: [42, 533, 1248, 387], ms: 800}
      - {image: base.png}
  - id: frog
    name: 小青蛙
    intro: 小青蛙，呱呱叫。呱呱！
    art:
      base.png:
        ref: vehicles/bus/base.png
        prompt: 一只圆眼睛的小青蛙，蹲坐在一片大荷叶上，身体朝右，嘴巴闭着
      k1.png: 小青蛙下巴下面鼓起一个大大的圆泡泡（鸣囊），嘴边画 2 到 3 条短弧线表示呱呱叫；荷叶不变
    frames:
      - {image: k1.png, region: [972, 244, 395, 441], ms: 400}
      - {image: base.png, ms: 200}
      - {image: k1.png, region: [972, 244, 395, 441], ms: 400}
