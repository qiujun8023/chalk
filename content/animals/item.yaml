    art:
      base.png:
        ref: vehicles/bus/base.png
        prompt: 一只奶牛，四脚站立，身体朝右，身上有几块大斑点（斑点只画轮廓不涂黑），头上两只小角，长尾巴垂下，嘴巴闭着
