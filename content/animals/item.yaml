  - id: elephant
    name: 大象
    intro: 大象鼻子长，喷喷水。噗——！
    art:
      base.png:
        ref: vehicles/bus/base.png
        prompt: 一只圆滚滚的小象，四脚站立，身体朝右，大耳朵，长鼻子自然垂下来，嘴巴微笑
      k1.png: 小象把长鼻子向上高高举起，鼻子尖朝上；身体、耳朵和腿不变
      k2.png: 小象鼻子向上高高举起，从鼻子尖喷出一道向上的水柱，水柱顶端散开成水花和几滴水珠；身体、耳朵和腿不变
    frames:
      - {image: k1.png, region: [1073, 7, 346, 945], ms: 400}
      - {image: k2.png, region: [1073, 0, 375, 952], ms: 1000}
      - {image: base.png}
  - id: bird
    name: 小鸟
    intro: 小鸟拍翅膀。叽叽喳喳！
    art:
      base.png:
        ref: vehicles/bus/base.png
        prompt: 一只圆滚滚的小鸟，站在一根横着的树枝上，身体朝右，翅膀收在身体两侧，尖嘴闭着
      k1.png: 小鸟张开两只翅膀向上扬起，尖嘴张开，嘴边画 2 条短弧线表示叽叽喳喳的叫声；树枝不变
      k2.png: 小鸟两只翅膀向下展开，尖嘴闭着；树枝不变
