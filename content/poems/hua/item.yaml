type: story
title: 画
pages:
  - say: 远看山有色。
    art:
      ref: stories/rainy-day/p01.png
      prompt: 远处有几座连绵的山，山上长着树
  - say: 近听水无声。
    art: 近处一条小溪静静地流过石头，水面平平的，一个小朋友侧耳听
  - say: 春去花还在。
    art: 小溪边一丛花开得很好，几片花瓣也不落
  - say: 人来鸟不惊。
    art: 那个小朋友走到树下，树枝上的小鸟安安静静地站着，一点也不飞走
  - say: 远看山有色，近听水无声。春去花还在，人来鸟不惊。
    art: 墙上挂着一幅画框，画框里画着远山、小溪、花丛和树枝上的小鸟，那个小朋友站在画框前看
