type: story
title: 悯农
author: 李绅
pages:
  - say: 锄禾日当午。
    art:
      ref: stories/rainy-day/p01.png
      prompt: 中午，天上一个大太阳，一位戴草帽的农民伯伯拿着锄头在田里锄地，田里长着禾苗
  - say: 汗滴禾下土。
    art: 那位戴草帽的农民伯伯满头大汗，汗珠一滴一滴落进禾苗下的土里
  - say: 谁知盘中餐。
    art: 桌上放着一碗满满的米饭和一双筷子
  - say: 粒粒皆辛苦。
    art: 一个小朋友捧着空碗开心地笑，碗里的饭吃得干干净净，一粒也没剩
  - say: 锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。
    art: 全景：那个小朋友坐在桌前吃饭，窗外的田里那位戴草帽的农民伯伯在锄地
