type: story
title: 池上
author: 白居易
pages:
  - say: 小娃撑小艇。
    art:
      ref: stories/rainy-day/p01.png
      prompt: 一个圆脸的小娃娃站在一条小船上，用一根长竹竿撑船，四周有荷叶
  - say: 偷采白莲回。
    art: 那个小娃娃怀里抱着几朵莲花，坐在小船上往回划
  - say: 不解藏踪迹。
    art: 那个小娃娃回头开心地笑，一点也没注意身后的水面
  - say: 浮萍一道开。
    art: 小船后面的水面上铺满小圆点一样的浮萍，中间被小船分开一道长长的水路
  - say: 小娃撑小艇，偷采白莲回。不解藏踪迹，浮萍一道开。
    art: 池塘全景：荷叶和莲花之间，那个小娃娃撑着小船往前划，船后浮萍分开一道水路
