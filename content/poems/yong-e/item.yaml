type: story
title: 咏鹅
author: 骆宾王
pages:
  - say: 鹅，鹅，鹅。
    art:
      ref: stories/rainy-day/p01.png
      prompt: 池塘边站着一只大白鹅，长长的脖子，扁扁的嘴，张开翅膀
  - say: 曲项向天歌。
    art: 那只大白鹅弯着长脖子抬头向天叫，嘴边有几条表示叫声的短线
  - say: 白毛浮绿水。
    art: 那只大白鹅浮在水面上，水面有几道波纹和几根水草
  - say: 红掌拨清波。
    art: 那只大白鹅在水面上游，水面下能看见它的两只脚掌在划水，身后一圈圈波纹
  - say: 鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。
    art: 池塘全景：那只大白鹅在水上游，弯着脖子抬头，岸边有柳树和芦苇
