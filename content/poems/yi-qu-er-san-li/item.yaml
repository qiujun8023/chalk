type: story
title: 一去二三里
author: 邵雍
pages:
  - say: 一去二三里。
    art:
      ref: stories/rainy-day/p01.png
      prompt: 一个扎小辫的小朋友沿着一条弯弯的小路往远处走，路伸向远方的山脚
  - say: 烟村四五家。
    art: 远处的山脚下有五座小房子，屋顶的烟囱冒着弯弯的炊烟，那个小朋友站在路上远远看着
  - say: 亭台六七座。
    art: 山坡上散落着六座带尖顶的小亭子，那个小朋友伸出手指一座一座地数
  - say: 八九十枝花。
    art: 路边开着一大片花，一枝一枝数不清，那个小朋友蹲在花旁边闻
  - say: 一去二三里，烟村四五家。亭台六七座，八九十枝花。
    art: 全景：一条弯弯的小路，山脚下冒炊烟的小村庄，山坡上的小亭子，路边一片花，那个小朋友走在路上
