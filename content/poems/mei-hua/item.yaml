type: story
title: 梅花
author: 王安石
pages:
  - say: 墙角数枝梅。
    art:
      ref: stories/rainy-day/p01.png
      prompt: 院子的墙角里伸出几枝梅花，枝条弯弯，开着几朵五瓣的小花
  - say: 凌寒独自开。
    art: 下雪了，墙角的梅花枝上积着雪，梅花照样开着，四周飘着雪花
  - say: 遥知不是雪。
    art: 一个戴毛线帽的小朋友远远地看着墙角的梅花，枝头的花白白的像雪
  - say: 为有暗香来。
    art: 那个戴毛线帽的小朋友闭着眼睛闻花香，鼻子前飘着几道弯弯的香气线
  - say: 墙角数枝梅，凌寒独自开。遥知不是雪，为有暗香来。
    art: 全景：雪地里的院子，墙角一株开满花的梅树，那个戴毛线帽的小朋友站在旁边闻花香
