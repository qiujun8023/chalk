type: story
title: 静夜思
author: 李白
pages:
  - say: 床前明月光。
    art:
      ref: stories/rainy-day/p01.png
      prompt: 夜晚的屋里，一位穿长袍的古代诗人坐在床边，月光从窗户照进来，落在床前的地上
  - say: 疑是地上霜。
    art: 床前的地上铺着一片白白的月光，画几道表示亮光的短线，那位诗人低头看着地面
  - say: 举头望明月。
    art: 参考图里同一位穿长袍、扎发髻的古代诗人（脸和参考图一样，正面圆脸、小鼻子）坐在床边，抬起头望着窗外圆圆的月亮
  - say: 低头思故乡。
    art: 那位诗人低着头，头顶的想象泡泡里画着远方的小村庄和小房子
  - say: 床前明月光，疑是地上霜。举头望明月，低头思故乡。
    art: 全景：夜里，那位诗人坐在床边，窗外挂着圆圆的月亮，月光洒在地上
