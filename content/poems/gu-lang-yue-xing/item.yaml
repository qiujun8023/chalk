type: story
title: 古朗月行
author: 李白
pages:
  - say: 小时不识月。
    art:
      ref: stories/rainy-day/p01.png
      prompt: 夜晚，一个圆脸的小朋友站在院子里，抬头看天上圆圆的月亮，歪着小脑袋
  - say: 呼作白玉盘。
    art: 那个小朋友指着月亮，头顶的想象泡泡里画着一个圆圆的大盘子
  - say: 又疑瑶台镜。
    art: 那个小朋友托着下巴想，头顶的想象泡泡里画着一面挂在仙宫里的圆镜子
  - say: 飞在青云端。
    art: 圆圆的月亮飘在一层层云朵的上面，那个小朋友在下面仰头看
  - say: 小时不识月，呼作白玉盘。又疑瑶台镜，飞在青云端。
    art: 全景：夜空里圆圆的月亮挂在云朵上方，那个小朋友站在院子里抬头看月亮
