type: story
title: 夜宿山寺
author: 李白
pages:
  - say: 危楼高百尺。
    art:
      ref: stories/rainy-day/p01.png
      prompt: 夜晚，山顶上有一座很高很高的楼阁，楼顶快碰到天上的星星
  - say: 手可摘星辰。
    art: 一位穿长袍的古代诗人站在那座高楼顶上，伸手好像就能摘到星星
  - say: 不敢高声语。
    art: 夜晚，参考图里那座很高的楼阁，楼顶上站着同一位穿长袍、扎发髻的古代诗人，画得大一些，他用一只手捂着嘴小声说话，四周有星星
  - say: 恐惊天上人。
    art: 高楼上方的云朵上，几个小仙人盖着被子在睡觉，那位诗人在楼顶踮着脚
  - say: 危楼高百尺，手可摘星辰。不敢高声语，恐惊天上人。
    art: 全景：夜空下，山顶的高楼伸进星星里，那位诗人站在楼顶，云朵上的小仙人睡着了
