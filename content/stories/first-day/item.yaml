type: story
title: 第一天上幼儿园
pages:
  - say: 今天，小朋友第一天上幼儿园。
    art:
      ref: stories/zoo-bus/p01.png
      prompt: 参考图里的这个扎两个小辫子的小女孩背着小书包，牵着妈妈的手站在幼儿园门口，大门是一排矮栏杆和一个拱门，拱门上挂着一面小三角旗，上面没有任何文字。不要画车辆
  - say: 小朋友抱着妈妈：我不想和妈妈分开。
    art: 那个小女孩紧紧抱着妈妈的腿，嘴巴撅着，眼角挂着一滴小泪珠，妈妈低头看着她
  - say: 妈妈说：下午我第一个来接你，拉钩！
    art: 妈妈蹲下来和那个小女孩面对面，两人伸出小手指勾在一起拉钩，小女孩不哭了
  - say: 老师牵着她的手走进教室，小朋友们在搭积木。
    art: 一位长头发、笑眯眯的老师阿姨牵着那个小女孩的手走进教室，教室里有一张小桌子，两个小朋友坐在地上搭积木
  - say: 她和新朋友一起，搭了一座高高的塔。
    art: 那个小女孩和一个圆脸短发的小男孩一起搭一座高高的积木塔，两个人都在笑
  - say: 大家一起拍手唱歌，真开心。
    art: 几个小朋友围坐成一圈拍手唱歌，那个小女孩坐在中间笑得很开心，头顶上画几个音符
  - say: 放学啦，妈妈第一个来接她！明天还要来！
    art: 幼儿园门口，妈妈张开双臂蹲着，那个小女孩张开手臂向妈妈跑过去，脸上笑开了花
