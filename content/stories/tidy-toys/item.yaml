type: story
title: 小猪收玩具
pages:
  - say: 小猪玩了一下午，玩具扔得满地都是。
    art:
      ref: stories/sleepy-piggy/p01.png
      prompt: 参考图里的这只圆滚滚的小猪坐在房间的地板上，四周散落着几块积木、一辆玩具小汽车、一个皮球和一个布娃娃，房间角落有一个打开的大玩具箱
  - say: 哎哟！小猪踩到了积木，好疼呀。
    art: 那只小猪一只脚踩在一块积木上，另一只脚抬起来单脚跳，表情很疼，头上有几条表示疼的短线，地上还散落着别的玩具
  - say: 积木回家啦，一块，两块，三块。
    art: 那只小猪把手里的一块积木放进打开的大玩具箱里，箱子里已经有几块积木
  - say: 小汽车，开回车库，嘀嘀！
    art: 那只小猪把玩具小汽车放到墙边一个矮架子上，架子上已经整齐排着两辆小汽车
  - say: 皮球和布娃娃，也回家睡觉啦。
    art: 那只小猪一手抱着皮球，一手抱着布娃娃，正往玩具箱里放
  - say: 房间干干净净，小猪真能干！
    art: 整整齐齐的房间：地板上什么都没有，玩具箱盖上了盖子，架子上排着小汽车，那只小猪双手叉腰开心地笑，旁边画几颗闪光的小星星
