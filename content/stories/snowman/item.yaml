type: story
title: 堆雪人
pages:
  - say: 下雪啦！白白的雪花，飘呀飘。
    art:
      ref: stories/construction-day/p01.png
      prompt: 一个戴毛线帽的圆脸小朋友趴在窗户边往外看，窗外飘着许多雪花，屋顶上积着雪
  - say: 穿上棉袄，戴上手套，去雪地里玩。
    art: 那个小朋友穿着厚厚的棉袄、戴着手套和毛线帽站在雪地里，天上飘着雪花，身后有一串脚印
  - say: 滚呀滚，小雪球变成大雪球。
    art: 那个小朋友弯着腰在雪地上推一个大雪球，雪球后面留下一道滚过的痕迹
  - say: 再滚一个小雪球，放上去当脑袋。
    art: 那个小朋友把一个小雪球抱起来放在大雪球上面，两个雪球摞成雪人的身子和脑袋
  - say: 胡萝卜当鼻子，小石子当眼睛，树枝当小手。
    art: 那个小朋友给雪人插上一根胡萝卜当鼻子，雪人脸上有两颗小石子当眼睛，身体两边插着两根树枝当手
  - say: 戴上帽子，围上围巾，雪人笑啦。
    art: 雪人戴上一顶帽子、围上一条围巾，脸上用小石子摆出一个弯弯的笑脸，那个小朋友站在旁边开心地拍手
  - say: 天黑了。雪人，晚安，明天再来玩！
    art: 夜晚，雪人站在院子里，天上有一弯月亮和几颗星星，旁边房子的窗户里那个小朋友在挥手
