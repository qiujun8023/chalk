type: story
title: 下雨啦
pages:
  - say: 天上飘来一朵大大的乌云。
    art:
      ref: stories/construction-day/p01.png
      prompt: 天空中飘来一朵大大的乌云，乌云下面是一排小房子和一条地平线，画面留白多
  - say: 滴答，滴答，下雨啦！
    art:
      ref: p03.png
      prompt: 天上一朵大乌云落下许多雨滴，地面上溅起小水花；参考图里同一个小女孩（同样的发型和脸）还没穿雨衣，站在小房子的屋檐下伸出一只手接雨
  - say: 小朋友穿上雨衣，穿上雨靴，撑起小雨伞。
    art: 那个小女孩穿上带帽子的雨衣和雨靴，撑起一把小雨伞，雨滴落在伞上
  - say: 雨点打在小雨伞上，滴滴答答，像在唱歌。
    art:
      ref: p03.png
      prompt: 参考图里同一个穿带帽雨衣、雨靴的小女孩撑着小雨伞站着，侧着头开心地听，雨滴落在伞面上溅开，伞边画几个小音符
  - say: 踩一踩小水坑，啪嗒，啪嗒！
    art:
      ref: p03.png
      prompt: 参考图里同一个穿带帽雨衣、雨靴的小女孩一手撑着小雨伞，双脚在地上的水坑里跳，水坑溅起水花
  - say: 雨停了，天上出现了一道彩虹。
    art:
      ref: p03.png
      prompt: 雨停了，天上出现一道彩虹（用几条并排的弧线画），参考图里同一个穿带帽雨衣、雨靴的小女孩手里拿着收起的雨伞，抬头看彩虹
  - say: 小蜗牛也出来散步啦，慢慢爬，慢慢爬。
    art:
      ref: p03.png
      prompt: 雨后湿湿的地面上有几个小水坑，一只背着螺旋壳的小蜗牛慢慢爬，参考图里同一个穿带帽雨衣、雨靴的小女孩蹲在旁边看它。不要画落叶
