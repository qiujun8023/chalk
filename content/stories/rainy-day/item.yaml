type: story
title: 下雨啦
pages:
  - image: p01.png
    say: 天上飘来一朵大大的乌云。
  - image: p02.png
    say: 滴答，滴答，下雨啦！
  - image: p03.png
    say: 小朋友穿上雨衣，穿上雨靴，撑起小雨伞。
  - image: p04.png
    say: 雨点打在小雨伞上，滴滴答答，像在唱歌。
  - image: p05.png
    say: 踩一踩小水坑，啪嗒，啪嗒！
  - image: p06.png
    say: 雨停了，天上出现了一道彩虹。
  - image: p07.png
    say: 小蜗牛也出来散步啦，慢慢爬，慢慢爬。
