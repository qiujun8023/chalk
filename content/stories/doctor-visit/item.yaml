type: story
title: 去医院打针
pages:
  - say: 阿嚏！小朋友感冒了，鼻子痒痒的。
    art:
      ref: stories/garbage-day/p01.png
      prompt: 参考图里的这个圆脸短发小男孩坐在床上打喷嚏，眼睛紧闭，嘴前方喷出几颗小水滴和几条短线
  - say: 妈妈带他去医院看医生。
    art: 那个小男孩牵着妈妈的手走到一座小房子形状的医院门口，医院门上方有一个大大的十字标志，没有任何文字
  - say: 医生阿姨用听诊器听一听：扑通，扑通。
    art: 一位戴口罩、穿白大褂的医生阿姨用听诊器听那个小男孩的胸口，小男孩坐在椅子上，眼睛好奇地看着听诊器
  - say: 要打针啦，小朋友有点害怕，紧紧抱住妈妈。
    art: 那个小男孩坐在妈妈腿上，紧紧抱着妈妈，眼睛紧紧闭着，一位护士阿姨拿着一支小针筒站在旁边
  - say: 像小蚂蚁咬了一下，一下就好了。小朋友没有哭！
    art: 在医院里，那个小男孩坐在一张小椅子上，胳膊上贴着一块小小的创可贴，他眼角挂着一滴小泪珠，但是嘴巴在笑，不要画床
  - say: 医生阿姨夸他真勇敢，送他一颗小星星。
    art: 穿白大褂的医生阿姨把一枚五角星贴纸贴在那个小男孩的衣服上，小男孩开心地笑，星星旁边有几条闪光短线
  - say: 过了几天，病好啦，又能出去玩啦！
    art: 那个小男孩在公园的草地上奔跑，手里牵着一只飞在天上的风筝，左上角一个带光线的太阳，地面一条横线
