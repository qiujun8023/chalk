type: story
title: 小兔吃青菜
pages:
  - say: 吃饭啦！小兔坐在小椅子上。
    art:
      ref: stories/get-dressed/p01.png
      prompt: 参考图里的这只长耳朵小兔子坐在餐桌前的儿童高脚椅上，面前有一个碗和一个小盘子，盘子里有几根青菜和胡萝卜片，手里拿着一把小勺子
  - say: 小兔把青菜推到一边：我不要吃青菜！
    art: 那只小兔子嘟着嘴把头扭到一边，用小勺子把盘子里的青菜推到盘子边上
  - say: 兔妈妈说：吃了青菜，身体棒棒，跑得快快。
    art: 那只小兔子坐在餐桌前，旁边站着一只系围裙的兔妈妈（长相和小兔子相似但个子更高），兔妈妈用筷子夹起一根青菜，笑着对小兔子说话
  - say: 小兔尝了一小口，嚼一嚼。
    art: 那只小兔子闭着一只眼睛、皱着眉头，小心地咬了一小口勺子里的青菜
  - say: 咦，脆脆的，真好吃！
    art: 那只小兔子眼睛笑成弯弯的月牙，大口吃着青菜，脸颊鼓鼓的
  - say: 饭菜吃光光，小肚子圆鼓鼓。
    art: 那只小兔子坐在餐桌前摸着圆鼓鼓的肚子开心地笑，面前的碗和盘子都空了
  - say: 小兔吃饱了，蹦得高高的！
    art: 那只小兔子在草地上高高蹦起来，身体下面画几条表示跳跃的短弧线，地面一条横线，草地上有几朵小花
