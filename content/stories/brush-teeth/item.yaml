type: story
title: 小熊刷牙
pages:
  - say: 早上好！小熊起床啦，伸个大懒腰。
    art:
      ref: stories/construction-day/p01.png
      prompt: 一只圆滚滚的小熊坐在床上伸懒腰，窗外有一个太阳
  - say: 拿起小牙刷，挤上一点点牙膏。
    art: 那只小熊站在洗手台前，一手拿牙刷一手拿牙膏，往牙刷上挤一点牙膏
  - say: 上刷刷，下刷刷，左刷刷，右刷刷。
    art: 那只小熊张大嘴巴用牙刷刷牙，嘴边有几个小泡泡，牙刷旁边画两条表示来回刷的短线
  - say: 喝一口水，咕噜咕噜，漱漱口。
    art: 那只小熊鼓着腮帮子含着一口水漱口，手里拿着一个小杯子，嘴边有几个水泡
  - say: 牙齿白白的，真干净！
    art: 那只小熊咧嘴笑，露出一排白白的牙齿，牙齿旁边画几颗闪光的小星星
  - say: 小熊笑一笑，去吃早饭啦。
    art: 那只小熊坐在桌子前开心地吃早饭，桌上有一碗粥和一个苹果
