type: story
title: 坐巴士去动物园
pages:
  - say: 今天，小朋友和妈妈坐巴士去动物园。
    art:
      ref: vehicles/bus/base.png
      prompt: 参考图里的这辆巴士停在站牌旁边，车门打开，一个扎两个小辫子的小女孩牵着妈妈的手准备上车，站牌上不要写字
  - say: 巴士开动啦，嘀嘀！趴在窗边往外看。
    art: 巴士车厢里，那个扎两个小辫子的小女孩跪在座位上趴着车窗往外看，妈妈坐在旁边，窗外有几棵树
  - say: 到站啦，动物园到了！
    art: 动物园的大门：两根门柱上面一道拱形门楣，门楣上不要写字，门里能看到几棵树，那个扎辫子的小女孩牵着妈妈的手站在门口
  - say: 大象的鼻子长又长，噗，喷出一股水。
    art: 一头大象站在池塘边，长鼻子高高举起向上喷出一股水，那个扎辫子的小女孩站在画面边上的矮栏杆外开心地看
  - say: 长颈鹿的脖子长长，吃到高高的树叶。
    art: 一只长颈鹿伸长脖子吃高高的树上的叶子，那个扎辫子的小女孩站在画面边上的矮栏杆外抬头看
  - say: 小猴子荡来荡去，吃香蕉。
    art: 一只小猴子用尾巴挂在树枝上荡来荡去，手里拿着一根香蕉，那个扎辫子的小女孩站在画面边上的矮栏杆外拍手
  - say: 大熊猫抱着竹子，咔嚓，咔嚓。
    art: 一只大熊猫坐在地上抱着一根竹子啃，那个扎辫子的小女孩站在画面边上的矮栏杆外看
  - say: 大狮子张大嘴巴：嗷呜！
    art: 一头大狮子坐在石头上张大嘴巴吼叫，嘴边有几条表示声音的短线，那个扎辫子的小女孩站在画面边上的矮栏杆外捂住耳朵
  - say: 玩累了，坐巴士回家，小朋友睡着啦。
    art: 回家的巴士车厢里，那个扎辫子的小女孩靠在妈妈身上睡着了，头上有一个小小的“Z”，窗外是落山的太阳
