type: story
title: 小猪睡不着
pages:
  - say: 天黑了，小猪躺在床上，眼睛睁得大大的：我一点也不困！
    art:
      ref: stories/construction-day/p01.png
      prompt: 夜晚的小卧室：一只圆滚滚的小猪躺在床上盖着被子，眼睛睁得大大的，窗外有一弯月亮和几颗星星
  - say: 小猪悄悄下了床：大家都睡着了吗？我去看看。
    art: 那只小猪下了床，踮着脚尖悄悄走出卧室门，回头看了一眼
  - say: 小鸡睡在鸡窝里，小翅膀盖着小脑袋。
    art: 夜晚，地上一个圆圆的草编鸡窝，窝里一只毛茸茸的小黄鸡闭着眼睛睡觉，尖尖的小嘴、两只小翅膀抱着自己，画得大而清楚；那只小猪站在鸡窝旁边，弯着腰轻轻地看
  - say: 小狗睡在狗窝里，呼噜，呼噜。
    art: 夜晚，一个小狗窝里一只小狗趴着睡着了，头上有几个小小的“Z”，那只小猪踮着脚走过
  - say: 小鱼睡在池塘里，吐出一个小泡泡。
    art: 夜晚的小池塘里，一条小鱼闭着眼睛睡觉，嘴边冒出一串小泡泡，那只小猪趴在池塘边看
  - say: 树上有一双圆眼睛！咕咕，咕咕——是猫头鹰。
    art: 夜晚，大树枝上站着一只猫头鹰，一双圆圆的大眼睛睁得大大的，那只小猪站在树下吃惊地抬头看
  - say: 猫头鹰说：我晚上才上班呢。小猪，快回去睡觉吧！
    art: 树枝上的猫头鹰张开一只翅膀，指向远处小猪家的房子，那只小猪站在树下点头
  - say: 小猪跑回家，钻进妈妈怀里，打了个大大的哈欠。
    art: 卧室里，猪妈妈坐在床边把那只小猪搂在怀里，小猪张大嘴巴打了一个大哈欠，窗外有月亮
  - say: 嘘——小猪睡着啦。晚安。
    art: 那只小猪闭着眼睛睡着了，被子盖到下巴，头上有一个小小的“Z”，窗外有一弯月亮和几颗星星
