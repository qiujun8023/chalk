type: story
title: 小兔穿衣服
pages:
  - image: p01.png
    say: 太阳出来了，小兔子起床啦。
  - image: p02.png
    say: 先穿上衣。小脑袋钻出来，小手伸出来。
  - image: p03.png
    say: 再穿裤子。一条腿，两条腿。
  - image: p04.png
    say: 穿上袜子。左脚一只，右脚一只。
  - image: p05.png
    say: 穿上小鞋子。啪，粘好魔术贴。
  - image: p06.png
    say: 戴上帽子，围上围巾。
  - image: p07.png
    say: 照照镜子，真神气！
  - image: p08.png
    say: 小兔子自己穿好衣服，背上书包去幼儿园啦！
