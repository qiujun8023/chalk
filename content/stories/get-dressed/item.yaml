type: story
title: 小兔穿衣服
pages:
  - say: 太阳出来了，小兔子起床啦。
    art:
      ref: stories/construction-day/p01.png
      prompt: 一只长耳朵的小兔子穿着睡衣坐在床上揉眼睛，窗外有一个太阳
  - say: 先穿上衣。小脑袋钻出来，小手伸出来。
    art:
      ref: p07.png
      prompt: 那只小兔子站在床边，正把一件圆领上衣从头上套进去，耳朵和小脑袋刚从领口钻出来。小兔子眼睛睁开，圆圆的黑眼珠，表情开心，衣服与参考图一样（圆领带扣子的上衣）
  - say: 再穿裤子。一条腿，两条腿。
    art:
      ref: p07.png
      prompt: 那只小兔子坐在床边，抬起一条腿把裤子穿进去。小兔子眼睛睁开，圆圆的黑眼珠，表情开心，衣服与参考图一样（圆领带扣子的上衣）
  - say: 穿上袜子。左脚一只，右脚一只。
    art:
      ref: p07.png
      prompt: 那只小兔子坐在地板上，用双手给一只脚穿袜子，另一只脚已经穿好了袜子。小兔子眼睛睁开，圆圆的黑眼珠，表情开心，衣服与参考图一样（圆领带扣子的上衣）
  - say: 穿上小鞋子。啪，粘好魔术贴。
    art:
      ref: p07.png
      prompt: 那只小兔子坐在小板凳上穿鞋，一只手按着鞋面上的魔术贴。小兔子眼睛睁开，圆圆的黑眼珠，表情开心，衣服与参考图一样（圆领带扣子的上衣）
  - say: 戴上帽子，围上围巾。
    art:
      ref: p07.png
      prompt: 那只小兔子戴上一顶露出脸的毛线帽，两只长耳朵从帽子上的两个洞里伸出来，脖子上围着一条围巾。小兔子眼睛睁开，圆圆的黑眼珠，表情开心，衣服与参考图一样（圆领带扣子的上衣）
  - say: 照照镜子，真神气！
    art: 那只小兔子穿戴整齐站在一面落地镜子前，镜子里映出它的样子，它挺起胸脯笑着
  - say: 小兔子自己穿好衣服，背上书包去幼儿园啦！
    art: 那只小兔子背着一个小书包走出家门，回头挥手，门外有一条小路和一棵树
