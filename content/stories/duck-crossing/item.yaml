type: story
title: 小鸭子过马路
pages:
  - say: 鸭妈妈带着五只小鸭子，要去池塘游泳。
    art:
      ref: stories/construction-day/p01.png
      prompt: 一只鸭妈妈走在前面，后面排成一队跟着五只毛茸茸的小鸭子，地面一条横线，远处有一个小池塘和几根芦苇
  - say: 前面有一条大马路。嘎嘎，怎么过去呢？
    art: 参考图里同样的鸭妈妈和五只小鸭子（鸭妈妈的外形、短脖子、扁嘴与参考图完全一样，不要画成鹅），排成一队站在马路边，马路上画着一道斑马线，鸭妈妈看着马路对面
  - say: 警车开来了，警察叔叔举起手：停一停！
    art:
      ref: vehicles/police-car/base.png
      prompt: 参考图里的这辆警车停在斑马线旁边，车身外形、车门上的“公安”两个字和车顶警灯都与参考图完全一样，一位戴帽子的警察叔叔站在车旁举起一只手示意停车
  - say: 巴士停下来，后面的小汽车也停下来，大家等一等。
    art:
      ref: vehicles/bus/base.png
      prompt: 参考图里的这辆巴士在斑马线前停下等待，车头前方地面有一条停止线，巴士后面还停着一辆小轿车
  - say: 鸭妈妈走在前面，一只小鸭子跟上。
    art: 鸭妈妈带头走上斑马线，第一只小鸭子跟在她身后
  - say: 两只，三只，四只，一个跟着一个。
    art: 鸭妈妈带着四只小鸭子排成一队走在斑马线中间。画面里只有四只小鸭子，不要画第五只
  - say: 第五只小鸭子走得最慢。快点快点，追上啦！
    art: 最后一只最小的小鸭子张开小翅膀在斑马线上奔跑追赶队伍，身后有几条表示速度的短线
  - say: 扑通，扑通，小鸭子们跳进池塘。谢谢警察叔叔！
    art: 鸭妈妈和五只小鸭子在池塘里游泳，水面有一圈圈波纹，岸边有几根芦苇，天上有太阳
