type: story
title: 小熊洗手
pages:
  - say: 小熊在院子里玩沙子，挖呀挖，真开心！
    art:
      ref: stories/brush-teeth/p01.png
      prompt: 参考图里的这只小熊蹲在院子的沙堆旁玩沙子，手里拿着一把小铲子，旁边有一个小桶，地面一条横线
  - say: 哎呀，小手脏脏的。吃饭前，要先洗手。
    art: 那只小熊站着，把两只手掌伸到面前看，手掌上沾着许多小黑点，小熊皱着眉头
  - say: 打开水龙头，哗啦啦，把小手冲湿。
    art: 那只小熊站在洗手台前，打开水龙头，几条水流从水龙头流下来冲在小熊的两只手上
  - say: 抹上香皂，搓呀搓，搓出好多小泡泡。
    art: 那只小熊站在洗手台前两手互相搓，手上和周围飘着许多圆圆的小泡泡，洗手台边放着一块香皂
  - say: 手心、手背、手指缝，都冲干净。
    art: 那只小熊在水龙头下冲手，水流把泡泡冲走，几颗水珠溅起来
  - say: 用小毛巾擦一擦，小手干干的。
    art: 那只小熊用一条挂在墙上的小毛巾擦手，脸上笑眯眯
  - say: 小手洗得香喷喷，吃饭啦！
    art: 那只小熊坐在餐桌前，举起两只干干净净的小手，手旁边画几颗闪光的小星星，桌上有一碗饭
