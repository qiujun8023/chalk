# 推送 vX.Y.Z annotated tag 时发布：校验 tag，构建整片镜像，连同 sha256 上传到同名 GitHub Release。
# Release notes 取 tag message 的正文（第一行标题之后）。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: 校验 tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: tag 格式与顺序
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 必须是 vX.Y.Z，实际是 $GITHUB_REF_NAME" >&2
            exit 1
          fi
          latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$latest" != "$GITHUB_REF_NAME" ]; then
            echo "只能发布最新的 tag：最新是 $latest，实际是 $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Release notes
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "必须是 annotated tag，message 正文即 Release notes" >&2
            exit 1
          fi
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)' > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "tag message 正文至少要有一条变更" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  firmware:
    name: 构建镜像
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.5.6 # 与 firmware/.envrc 一致
    steps:
      # 完整拉取，固件版本号才能从 tag 得到（version.cmake）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build

      - name: 打包
        run: |
          set -euo pipefail
          mkdir -p dist
          full="chalk-zectrix-note4-$GITHUB_REF_NAME-full.bin"
          cp firmware/build/merged-binary.bin "dist/$full"
          (cd dist && sha256sum "$full" > "chalk-zectrix-note4-$GITHUB_REF_NAME-sha256.txt")

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  github-release:
    name: 发布 Release
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release"
          assets=("$dir"/firmware/*)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$dir/notes/notes.md"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$dir/notes/notes.md"
          fi
