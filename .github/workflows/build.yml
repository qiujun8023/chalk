# master 上的滚动构建：验证能从仓库完整构建，不代表稳定版本。发版见 release.yml。
name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.5.6 # 与 firmware/.envrc 一致
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build
