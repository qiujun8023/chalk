# push 到 master 时验证能从仓库完整构建；推 v* tag 时再把整片镜像发到 Release。
# 朗读音频全部来自已入库的 content/tts/，不配 TTS key：缓存未命中直接失败。
name: build

on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6 # 与 firmware/.envrc 一致
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # 容器内仓库属主不同，不加的话 git 拒绝读取，固件版本号会变成「-」。
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - uses: astral-sh/setup-uv@v7

      - name: 内容
        working-directory: tools
        run: go vet . && go build -o chalk . && ./chalk build

      # 构建会删掉没用到的音频；工作区有变化说明 content/tts/ 与文案不同步，也会让固件版本号带「+」。
      - run: git status --porcelain && test -z "$(git status --porcelain)"

      - name: 固件
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build merge-bin

      - if: startsWith(github.ref, 'refs/tags/')
        run: cp firmware/build/merged-binary.bin "chalk-$GITHUB_REF_NAME.bin"

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: chalk-${{ github.ref_name }}.bin
          generate_release_notes: true
