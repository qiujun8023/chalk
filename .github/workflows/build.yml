# 构建固件和内容的整片镜像。push 到 master 是滚动构建；推 vX.Y.Z annotated tag 时再发布到同名 Release，
# Release notes 取 tag message 正文（第一行标题之后）。
# 插图和朗读都已入库，chalk build 不调 AI；生成文件缺失或与 gen.lock 不一致时失败。
name: build

on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.5.6 # 与 firmware/.envrc 一致
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      # 完整拉取：annotated tag 才不会被拉成轻量 tag，固件版本号也要从 tag 得到（version.cmake）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 容器内仓库属主不同，不加的话 git 拒绝读取，固件版本号会变成「-」。
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 校验 tag
        if: env.RELEASE == 'true'
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag 必须是 vX.Y.Z" >&2; exit 1; }
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] || { echo "必须是 annotated tag，message 正文即 Release notes" >&2; exit 1; }
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)' > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "tag message 正文至少要有一条变更" >&2; exit 1; }

      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg $([ "$RELEASE" = true ] && echo gh)

      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # 只用 uvx 跑固定版本的 littlefs-python，没有依赖文件可做缓存键

      - name: 内容
        working-directory: tools
        run: go vet . && go build -o chalk . && ./chalk build

      # 构建不应改动仓库；工作区有变化也会让固件版本号带「+」。
      - run: git status --porcelain && test -z "$(git status --porcelain)"

      - name: 固件
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build merge-bin

      - name: 发布
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin="chalk-$GITHUB_REF_NAME.bin"
          cp firmware/build/merged-binary.bin "$bin"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$GITHUB_REF_NAME" "$bin" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$bin" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
